<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>JOD-AI · Delhi NCR Pilot</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#08080f;color:#f0eee8;font-family:'DM Sans',sans-serif}
input{color:#f0eee8;font-family:'DM Sans',sans-serif}
input::placeholder{color:rgba(240,238,232,0.35)}
input:focus{border-color:rgba(232,132,10,0.55)!important;outline:none}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const C={bg:"#08080f",surface:"#10101a",surface2:"#181825",border:"rgba(255,255,255,0.08)",amber:"#e8840a",teal:"#1d9e75",purple:"#a855f7",text:"#f0eee8",muted:"rgba(240,238,232,0.5)",mutedLo:"rgba(240,238,232,0.22)",green:"#22c55e"};
const SIGNS=["Aries","Taurus","Gemini","Cancer","Leo","Virgo","Libra","Scorpio","Sagittarius","Capricorn","Aquarius","Pisces"];
const SIGN_EMOJI={Aries:"♈",Taurus:"♉",Gemini:"♊",Cancer:"♋",Leo:"♌",Virgo:"♍",Libra:"♎",Scorpio:"♏",Sagittarius:"♐",Capricorn:"♑",Aquarius:"♒",Pisces:"♓"};
const KEYWORDS=["Chaotic energy","Late night thinker","Bookworm","Meme lord","Foodie","Traveller","Gym bro","Artist","Music nerd","Film buff","Introvert","Overthinker","Coffee addict","Plant parent","Dog person","Night owl","Spiritualist","Tech geek","Dancer","Philosopher"];
const MEMES=[{e:"🌑",l:"Existential dread"},{e:"🌸",l:"Wholesome chaos"},{e:"🎭",l:"Desi pop culture"},{e:"🦆",l:"Absurdist humor"},{e:"😅",l:"Self-deprecating"},{e:"📰",l:"Political satire"},{e:"🌙",l:"Midnight thoughts"},{e:"💪",l:"Motivational irony"},{e:"🎯",l:"Niche references"},{e:"🤪",l:"Pure silliness"},{e:"📉",l:"Millennial pain"},{e:"🧠",l:"Philosopher king"}];
const VIBES=[{id:"cool",bg:"#1a3a5c",fg:"#7ab8f5",label:"Cool",desc:"Blues · calm · minimal"},{id:"fire",bg:"#5c1a1a",fg:"#f57a7a",label:"Bold",desc:"Reds · intense · fire"},{id:"chill",bg:"#1a5c2a",fg:"#7af590",label:"Chill",desc:"Greens · nature · relaxed"},{id:"mystic",bg:"#3d1a5c",fg:"#c07af5",label:"Mystic",desc:"Purples · esoteric · deep"},{id:"warm",bg:"#5c3d1a",fg:"#f5c07a",label:"Warm",desc:"Ambers · cozy · golden"},{id:"ocean",bg:"#1a4a5c",fg:"#7ae8f5",label:"Ocean",desc:"Teals · fluid · free"}];
const FOODS=["Biryani","Momos","Sushi","Pizza","Chole Bhature","Tacos","Pasta","Butter Chicken","Pani Puri","Ramen","Dal Makhani","Shawarma","Maggi","Dosa","Burger","Thali"];
const BRANDS=["Nike","Fabindia","Supreme","Zara","Manyavar","H&M","Wildcraft","Uniqlo","Forest Essentials","New Balance","Levi's","Good Earth","Bewakoof","Snitch","Rare Rabbit","Noise"];
const SPOTS=["Hauz Khas Village","Lodhi Garden","Connaught Place","Dilli Haat","Sarojini Nagar","Majnu Ka Tilla","Mehrauli","Agrasen Ki Baoli","Sunder Nursery","Khan Market","Chandni Chowk","India Gate","Lajpat Nagar","Cyber Hub","Select City Walk"];

function App(){
  const [q,setQ]=React.useState(0);
  const [saved,setSaved]=React.useState(false);
  const [saving,setSaving]=React.useState(false);
  const [name,setName]=React.useState("");
  const [age,setAge]=React.useState("");
  const [area,setArea]=React.useState("");
  const [gender,setGender]=React.useState("");
  const [openTo,setOpenTo]=React.useState("");
  const [sign,setSign]=React.useState("");
  const [keywords,setKeywords]=React.useState([]);
  const [memes,setMemes]=React.useState([]);
  const [vibe,setVibe]=React.useState("");
  const [food,setFood]=React.useState([]);
  const [brands,setBrands]=React.useState([]);
  const [spot,setSpot]=React.useState("");
  const [show,setShow]=React.useState("");
  const [other,setOther]=React.useState("");
  const [contact,setContact]=React.useState("");
  const TOTAL=14;

  const submit=async()=>{
    setSaving(true);
    try{
      const res=await fetch("https://formspree.io/f/mwvawkww",{
        method:"POST",
        headers:{"Accept":"application/json"},
        body:JSON.stringify({name,age,area,gender,openTo,sign,keywords:keywords.join(", "),memes:memes.join(", "),vibe,food:food.join(", "),brands:brands.join(", "),spot,show,other,contact,submitted:new Date().toISOString()})
      });
      if(res.ok){setSaved(true);}
      else{alert("Something went wrong. Try again.");}
    }catch{alert("Something went wrong. Check your connection.");}
    setSaving(false);
  };

  const W={background:C.bg,minHeight:"100vh",fontFamily:"'DM Sans',sans-serif",color:C.text};
  const H2s={fontFamily:"'Syne',sans-serif",fontWeight:700,letterSpacing:-0.5,color:C.text};
  const LBL={fontFamily:"'Syne',sans-serif",fontSize:11,fontWeight:700,letterSpacing:3,textTransform:"uppercase",color:C.amber};
  const I={width:"100%",padding:"14px 16px",background:C.surface2,border:`1px solid ${C.border}`,borderRadius:10,color:C.text,fontSize:16,fontFamily:"'DM Sans',sans-serif",outline:"none",boxSizing:"border-box"};
  const Btn=on=>({background:on?C.amber:"rgba(232,132,10,0.1)",color:on?"#08080f":C.amber,border:"none",borderRadius:10,padding:"14px 20px",fontFamily:"'Syne',sans-serif",fontWeight:700,fontSize:15,cursor:on?"pointer":"default",width:"100%",opacity:on?1:0.4,marginTop:20,transition:"all 0.2s"});
  const Chip=(sel,colA,bgA)=>({padding:"9px 16px",borderRadius:24,cursor:"pointer",fontSize:14,fontWeight:sel?500:400,border:`1px solid ${sel?(colA||C.amber)+"88":C.border}`,background:sel?(bgA||"rgba(232,132,10,0.10)"):C.surface,color:sel?(colA||C.amber):C.text,transition:"all 0.15s",display:"inline-block"});
  const go=n=>setQ(n);
  const prog=q===0?0:Math.round((q/TOTAL)*100);

  if(saved)return(
    <div style={{...W,display:"flex",alignItems:"center",justifyContent:"center",padding:"40px 24px"}}>
      <div style={{maxWidth:360,width:"100%",textAlign:"center"}}>
        <div style={{fontSize:60,marginBottom:16}}>🪬</div>
        <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:40,letterSpacing:-2,marginBottom:4}}>JOD<span style={{color:C.amber}}>-AI</span></div>
        <div style={{...H2s,fontSize:22,marginBottom:10}}>You're in, {name}!</div>
        <p style={{fontSize:15,color:C.muted,lineHeight:1.75,marginBottom:24}}>Your consciousness fingerprint is saved. We'll calculate ChemScores and connect you with your matches shortly. 🪬</p>
        <div style={{background:"rgba(232,132,10,0.05)",border:"1px dashed rgba(232,132,10,0.3)",borderRadius:12,padding:"16px",textAlign:"left"}}>
          <div style={{...LBL,fontSize:10,marginBottom:8}}>Share with your people</div>
          <p style={{fontSize:13,color:C.muted,lineHeight:1.6,margin:0}}>Share this link with friends on WhatsApp or Instagram stories 👇</p>
          <div style={{background:C.surface2,borderRadius:8,padding:"10px 14px",marginTop:10,fontSize:13,color:C.amber,wordBreak:"break-all"}}>https://jod-ai-form-h1on.vercel.app</div>
        </div>
      </div>
    </div>
  );

  const pages=[
    <div key={0} style={{display:"flex",flexDirection:"column",justifyContent:"center",minHeight:"85vh"}}>
      <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:54,letterSpacing:-3,lineHeight:1,marginBottom:8}}>JOD<span style={{color:C.amber}}>-AI</span></div>
      <p style={{fontSize:16,color:C.muted,lineHeight:1.7,marginBottom:10}}>Delhi NCR's consciousness-first dating app.</p>
      <div style={{...LBL,marginBottom:20,letterSpacing:4,fontSize:10}}>Private Pilot · Delhi NCR</div>
      <div style={{background:C.surface,border:`1px solid ${C.border}`,borderRadius:14,padding:"18px 20px",marginBottom:12}}>
        <p style={{fontSize:14,color:C.muted,lineHeight:1.75,margin:0}}>Takes <strong style={{color:C.text}}>3 minutes.</strong> We match on <strong style={{color:C.amber}}>consciousness</strong> — your humor, values, vibe, astrology and soul — not just looks.</p>
      </div>
      <div style={{background:"rgba(34,197,94,0.05)",border:"1px solid rgba(34,197,94,0.2)",borderRadius:14,padding:"16px 18px",marginBottom:20,display:"flex",gap:12,alignItems:"flex-start"}}>
        <span style={{fontSize:18,flexShrink:0}}>🔒</span>
        <p style={{fontSize:13,color:C.muted,lineHeight:1.75,margin:0}}>Your data is stored encrypted. Only the matching algorithm sees it — not the founder, not any team member. You can ask us to delete everything anytime by reaching out to <strong style={{color:C.green}}>SAVVY founder</strong>.</p>
      </div>
      <button onClick={()=>go(1)} style={Btn(true)}>Let's go →</button>
    </div>,

    <div key={1}>
      <div style={LBL}>1 / {TOTAL}</div>
      <div style={{...H2s,fontSize:28,margin:"12px 0 8px"}}>What should we call you?</div>
      <p style={{fontSize:14,color:C.muted,marginBottom:20}}>Just your first name.</p>
      <input autoFocus value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&name.trim()&&go(2)} placeholder="Your name" style={I}/>
      <button onClick={()=>name.trim()&&go(2)} style={Btn(!!name.trim())}>Continue →</button>
    </div>,

    <div key={2}>
      <div style={LBL}>2 / {TOTAL}</div>
      <div style={{...H2s,fontSize:28,margin:"12px 0 8px"}}>Age & area</div>
      <p style={{fontSize:14,color:C.muted,marginBottom:20}}>Where in Delhi NCR are you?</p>
      <input value={age} onChange={e=>setAge(e.target.value)} placeholder="Your age" type="number" style={{...I,marginBottom:12}}/>
      <input value={area} onChange={e=>setArea(e.target.value)} placeholder="e.g. Hauz Khas, Sector 18, Gurugram" style={I}/>
      <button onClick={()=>age&&area.trim()&&go(3)} style={Btn(!!(age&&area.trim()))}>Continue →</button>
    </div>,

    <div key={3}>
      <div style={LBL}>3 / {TOTAL}</div>
      <div style={{...H2s,fontSize:28,margin:"12px 0 20px"}}>I am</div>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {["Man","Woman","Non-binary","Other"].map(g=>(
          <div key={g} onClick={()=>setGender(g)} style={{padding:"16px 20px",borderRadius:12,cursor:"pointer",border:`1px solid ${gender===g?"rgba(29,158,117,0.6)":C.border}`,background:gender===g?"rgba(29,158,117,0.10)":C.surface,color:gender===g?C.teal:C.text,fontSize:16,fontWeight:gender===g?500:400,transition:"all 0.15s"}}>{g}</div>
        ))}
      </div>
      <button onClick={()=>gender&&go(4)} style={Btn(!!gender)}>Continue →</button>
    </div>,

    <div key={4}>
      <div style={LBL}>4 / {TOTAL}</div>
      <div style={{...H2s,fontSize:28,margin:"12px 0 8px"}}>Open to matching with</div>
      <p style={{fontSize:14,color:C.muted,marginBottom:20}}>Only used for filtering. Never public.</p>
      <div style={{display:"flex",flexDirection:"column",gap:10}}>
        {["Men","Women","Everyone"].map(o=>(
          <div key={o} onClick={()=>setOpenTo(o)} style={{padding:"16px 20px",borderRadius:12,cursor:"pointer",border:`1px solid ${openTo===o?"rgba(168,85,247,0.6)":C.border}`,background:openTo===o?"rgba(168,85,247,0.10)":C.surface,color:openTo===o?C.purple:C.text,fontSize:16,fontWeight:openTo===o?500:400,transition:"all 0.15s"}}>{o}</div>
        ))}
      </div>
      <button onClick={()=>openTo&&go(5)} style={Btn(!!openTo)}>Continue →</button>
    </div>,

    <div key={5}>
      <div style={LBL}>5 / {TOTAL}</div>
      <div style={{...H2s,fontSize:28,margin:"12px 0 8px"}}>Your star sign ✦</div>
      <p style={{fontSize:14,color:C.muted,marginBottom:20}}>Just your sun sign.</p>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        {SIGNS.map(s=>{
          const sel=sign===s;
          const fc=["Aries","Leo","Sagittarius"].includes(s)?C.amber:["Cancer","Scorpio","Pisces"].includes(s)?"#60a5fa":["Taurus","Virgo","Capricorn"].includes(s)?C.teal:"#a78bfa";
          return(
            <div key={s} onClick={()=>setSign(s)} style={{padding:"12px 14px",borderRadius:12,cursor:"pointer",border:`1px solid ${sel?fc+"66":C.border}`,background:sel?fc+"12":C.surface,display:"flex",alignItems:"center",gap:10,transition:"all 0.15s"}}>
              <span style={{fontSize:20}}>{SIGN_EMOJI[s]}</span>
              <span style={{fontSize:14,fontWeight:sel?600:400,color:sel?fc:C.text}}>{s}</span>
            </div>
          );
        })}
      </div>
      <button onClick={()=>sign&&go(6)} style={Btn(!!sign)}>Continue →</button>
    </div>,

    <div key={6}>
      <div style={LBL}>6 / {TOTAL}</div>
      <div style={{...H2s,fontSize:28,margin:"12px 0 8px"}}>5 keywords that are you</div>
      <p style={{fontSize:14,color:C.muted,marginBottom:6}}>Pick exactly 5.</p>
      <p style={{fontSize:13,color:C.amber,marginBottom:16,fontWeight:500}}>{keywords.length}/5 selected</p>
      <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
        {KEYWORDS.map(k=>{const s=keywords.includes(k);return(
          <div key={k} onClick={()=>{if(s)setKeywords(p=>p.filter(x=>x!==k));else if(keywords.length<5)setKeywords(p=>[...p,k]);}} style={Chip(s)}>{k}</div>
        );})}
      </div>
      <button onClick={()=>keywords.length===5&&go(7)} style={Btn(keywords.length===5)}>Continue →</button>
    </div>,

    <div key={7}>
      <div style={LBL}>7 / {TOTAL}</div>
      <div style={{...H2s,fontSize:28,margin:"12px 0 8px"}}>Your meme energy</div>
      <p style={{fontSize:14,color:C.muted,marginBottom:6}}>What do you save at 2am? Pick up to 3.</p>
      <p style={{fontSize:13,color:C.purple,marginBottom:16,fontWeight:500}}>{memes.length}/3 selected</p>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        {MEMES.map(m=>{const s=memes.includes(m.l);return(
          <div key={m.l} onClick={()=>{if(s)setMemes(p=>p.filter(x=>x!==m.l));else if(memes.length<3)setMemes(p=>[...p,m.l]);}} style={{padding:"12px 14px",borderRadius:12,cursor:"pointer",border:`1px solid ${s?"rgba(168,85,247,0.55)":C.border}`,background:s?"rgba(168,85,247,0.08)":C.surface,display:"flex",gap:10,alignItems:"center",transition:"all 0.15s"}}>
            <span style={{fontSize:18,flexShrink:0}}>{m.e}</span>
            <span style={{fontSize:13,fontWeight:s?500:400,color:s?C.purple:C.text}}>{m.l}</span>
          </div>
        );})}
      </div>
      <button onClick={()=>memes.length>0&&go(8)} style={Btn(memes.length>0)}>Continue →</button>
    </div>,

    <div key={8}>
      <div style={LBL}>8 / {TOTAL}</div>
      <div style={{...H2s,fontSize:28,margin:"12px 0 8px"}}>Your photo vibe</div>
      <p style={{fontSize:14,color:C.muted,marginBottom:20}}>Which aesthetic is most you?</p>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
        {VIBES.map(v=>{const s=vibe===v.id;return(
          <div key={v.id} onClick={()=>setVibe(v.id)} style={{padding:"16px",borderRadius:14,cursor:"pointer",border:`1px solid ${s?"rgba(232,132,10,0.6)":C.border}`,background:s?"rgba(232,132,10,0.07)":C.surface,textAlign:"center",transition:"all 0.15s"}}>
            <div style={{width:42,height:42,borderRadius:"50%",background:v.bg,display:"flex",alignItems:"center",justifyContent:"center",margin:"0 auto 8px"}}><span style={{fontSize:14,fontWeight:700,color:v.fg}}>A</span></div>
            <div style={{fontSize:14,fontWeight:600,color:s?C.amber:C.text,marginBottom:2}}>{v.label}</div>
            <div style={{fontSize:11,color:C.muted}}>{v.desc}</div>
          </div>
        );})}
      </div>
      <button onClick={()=>vibe&&go(9)} style={Btn(!!vibe)}>Continue →</button>
    </div>,

    <div key={9}>
      <div style={LBL}>9 / {TOTAL}</div>
      <div style={{...H2s,fontSize:28,margin:"12px 0 8px"}}>Fav foods</div>
      <p style={{fontSize:14,color:C.muted,marginBottom:6}}>Pick up to 3.</p>
      <p style={{fontSize:13,color:"#f97316",marginBottom:16,fontWeight:500}}>{food.length}/3 selected</p>
      <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
        {FOODS.map(f=>{const s=food.includes(f);return(
          <div key={f} onClick={()=>{if(s)setFood(p=>p.filter(x=>x!==f));else if(food.length<3)setFood(p=>[...p,f]);}} style={Chip(s,"#f97316","rgba(249,115,22,0.10)")}>{f}</div>
        );})}
      </div>
      <button onClick={()=>food.length>0&&go(10)} style={Btn(food.length>0)}>Continue →</button>
    </div>,

    <div key={10}>
      <div style={LBL}>10 / {TOTAL}</div>
      <div style={{...H2s,fontSize:28,margin:"12px 0 8px"}}>Fav brands</div>
      <p style={{fontSize:14,color:C.muted,marginBottom:6}}>Aesthetic signal. Pick up to 3.</p>
      <p style={{fontSize:13,color:C.amber,marginBottom:16,fontWeight:500}}>{brands.length}/3 selected</p>
      <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
        {BRANDS.map(b=>{const s=brands.includes(b);return(
          <div key={b} onClick={()=>{if(s)setBrands(p=>p.filter(x=>x!==b));else if(brands.length<3)setBrands(p=>[...p,b]);}} style={Chip(s)}>{b}</div>
        );})}
      </div>
      <button onClick={()=>brands.length>0&&go(11)} style={Btn(brands.length>0)}>Continue →</button>
    </div>,

    <div key={11}>
      <div style={LBL}>11 / {TOTAL}</div>
      <div style={{...H2s,fontSize:28,margin:"12px 0 8px"}}>Fav Delhi spot</div>
      <p style={{fontSize:14,color:C.muted,marginBottom:20}}>Where do you spend your best time?</p>
      <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
        {SPOTS.map(s=>{const sel=spot===s;return(
          <div key={s} onClick={()=>setSpot(sel?"":s)} style={Chip(sel,C.teal,"rgba(29,158,117,0.10)")}>{s}</div>
        );})}
      </div>
      <button onClick={()=>go(12)} style={Btn(true)}>Continue →</button>
    </div>,

    <div key={12}>
      <div style={LBL}>12 / {TOTAL}</div>
      <div style={{...H2s,fontSize:28,margin:"12px 0 8px"}}>Comfort show</div>
      <p style={{fontSize:14,color:C.muted,marginBottom:20}}>What do you rewatch when life gets heavy?</p>
      <input value={show} onChange={e=>setShow(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go(13)} placeholder="e.g. Panchayat, Friends, Mirzapur..." style={I}/>
      <button onClick={()=>go(13)} style={Btn(true)}>Continue →</button>
    </div>,

    <div key={13}>
      <div style={LBL}>13 / {TOTAL}</div>
      <div style={{...H2s,fontSize:28,margin:"12px 0 8px"}}>One thing that defines you</div>
      <p style={{fontSize:14,color:C.muted,marginBottom:20}}>What you'd say unprompted. Most honest signal.</p>
      <input value={other} onChange={e=>setOther(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go(14)} placeholder="e.g. 3am drives, chai rituals, old Bollywood lyrics..." style={I}/>
      <button onClick={()=>go(14)} style={Btn(true)}>Continue →</button>
    </div>,

    <div key={14}>
      <div style={LBL}>14 / {TOTAL} · Last one</div>
      <div style={{...H2s,fontSize:28,margin:"12px 0 8px"}}>How do we reach you?</div>
      <p style={{fontSize:14,color:C.muted,marginBottom:20}}>Phone or Instagram — only to connect you with your match.</p>
      <input value={contact} onChange={e=>setContact(e.target.value)} placeholder="Phone number or @instagram" style={{...I,marginBottom:8}}/>
      <p style={{fontSize:11,color:C.mutedLo,marginBottom:4,lineHeight:1.6}}>🔒 Stored encrypted. Only shared when both parties agree.</p>
      <button onClick={()=>contact.trim()&&submit()} style={Btn(!!contact.trim())}>
        {saving?"Saving your vibe...":"Submit & find my matches ✦"}
      </button>
    </div>,
  ];

  return(
    <div style={W}>
      {q>0&&(
        <div style={{height:3,background:"rgba(255,255,255,0.05)"}}>
          <div style={{height:3,width:`${prog}%`,background:C.amber,transition:"width 0.4s"}}/>
        </div>
      )}
      {q>1&&(
        <div style={{padding:"12px 20px"}}>
          <button onClick={()=>setQ(q=>q-1)} style={{background:"transparent",color:C.muted,border:`1px solid ${C.border}`,borderRadius:8,padding:"6px 12px",cursor:"pointer",fontSize:13}}>← back</button>
        </div>
      )}
      <div style={{maxWidth:480,margin:"0 auto",padding:q===0?"48px 22px 56px":"16px 22px 56px",minHeight:"88vh",display:"flex",flexDirection:"column",justifyContent:q===0?"center":"flex-start"}}>
        {pages[q]}
      </div>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
